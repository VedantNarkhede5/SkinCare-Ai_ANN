<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkinAI – Sign In</title>
  {% load static %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600&display=swap');
    :root {
      --green-deep:#1E3A2F; --green-mid:#2D5A42; --green-light:#4A8C64;
      --sage:#8FBC8B; --cream:#F8F4EE; --warm-white:#FDFAF6;
      --gold:#C9A96E; --text-dark:#1A2E25; --text-muted:#6B8577; --red:#C0392B;
    }
    body {
      font-family:'Nunito',sans-serif; background:var(--cream);
      color:var(--text-dark); min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    body::before {
      content:''; position:fixed; top:0; left:0; right:0; bottom:0;
      background: radial-gradient(ellipse 60% 50% at 20% 20%, rgba(74,140,100,.08) 0%, transparent 60%),
                  radial-gradient(ellipse 50% 40% at 80% 80%, rgba(201,169,110,.06) 0%, transparent 60%);
      z-index:0; pointer-events:none;
    }
    .card {
      position:relative; z-index:1; background:#fff; border-radius:20px;
      box-shadow:0 12px 60px rgba(30,58,47,.1); width:100%; max-width:460px;
      overflow:hidden; animation:slideUp .6s ease both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .card-top {
      background:linear-gradient(135deg,var(--green-deep),var(--green-mid));
      padding:32px 40px 28px; position:relative; overflow:hidden;
    }
    .card-top::after {
      content:'🌿'; position:absolute; font-size:100px; opacity:0.07;
      bottom:-20px; right:-10px; transform:rotate(15deg);
    }
    .brand { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
    .brand-icon {
      width:30px; height:30px; border-radius:8px;
      background:linear-gradient(135deg,var(--sage),var(--gold));
      display:flex; align-items:center; justify-content:center; font-size:15px;
    }
    .brand-name { font-family:'Playfair Display',serif; font-size:18px; color:#fff; }
    .card-top h1 { font-family:'Playfair Display',serif; font-size:30px; font-weight:400; color:#fff; margin-bottom:4px; }
    .card-top p  { font-size:13px; color:rgba(255,255,255,.65); }
    .card-body { padding:36px 40px 40px; }
    .back-link {
      display:inline-flex; align-items:center; gap:6px; font-size:13px;
      color:var(--text-muted); text-decoration:none; margin-bottom:28px;
      transition:color .2s;
    }
    .back-link:hover { color:var(--green-mid); }
    /* messages */
    .msg { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .msg-error   { background:#FEF0EF; color:var(--red); border-left:3px solid var(--red); }
    .msg-success { background:#EFF7F2; color:var(--green-mid); border-left:3px solid var(--green-mid); }
    .form-group { margin-bottom:20px; }
    label { display:block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
    input[type=text], input[type=email], input[type=password] {
      width:100%; padding:13px 16px; border:1.5px solid rgba(30,58,47,.12);
      border-radius:10px; font-family:'Nunito',sans-serif; font-size:14px;
      color:var(--text-dark); background:var(--cream); outline:none; transition:all .2s;
    }
    input:focus { border-color:var(--green-light); box-shadow:0 0 0 3px rgba(74,140,100,.1); background:#fff; }
    .row-flex { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .remember { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); cursor:pointer; }
    .remember input[type=checkbox] { width:auto; accent-color:var(--green-mid); }
    .forgot { font-size:13px; color:var(--green-mid); text-decoration:none; font-weight:600; }
    .forgot:hover { text-decoration:underline; }
    .btn-submit {
      width:100%; padding:15px; background:linear-gradient(135deg,var(--green-mid),var(--green-light));
      color:#fff; border:none; border-radius:10px; font-family:'Nunito',sans-serif;
      font-size:15px; font-weight:700; cursor:pointer; letter-spacing:.3px;
      box-shadow:0 6px 20px rgba(45,90,66,.3); transition:all .25s ease;
    }
    .btn-submit:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(45,90,66,.4); }
    .footer-note { text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted); }
    .footer-note a { color:var(--green-mid); text-decoration:none; font-weight:700; }
    .footer-note a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="card">
  <!-- card top -->
  <div class="card-top">
    <div class="brand">
      <div class="brand-icon">🌿</div>
      <span class="brand-name">SkinAI</span>
    </div>
    <h1>Welcome Back</h1>
    <p>Sign in to continue your skincare journey</p>
  </div>
  <!-- card body -->
  <div class="card-body">
    <a href="{% url 'welcome' %}" class="back-link">← Back to Home</a>

    {% if messages %}
      {% for message in messages %}
        <div class="msg msg-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required value="{{ request.POST.username|default:'' }}"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required/>
      </div>
      <div class="row-flex">
        <label class="remember">
          <input type="checkbox" name="remember_me"/> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>
      <button type="submit" class="btn-submit">Sign In →</button>
    </form>

    <p class="footer-note">Don't have an account? <a href="{% url 'signup' %}">Create one free</a></p>
  </div>
</div>
</body>
</html>
